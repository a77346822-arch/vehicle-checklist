<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>차량 점검 체크리스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .noscript-warning {
    max-width: 560px;
    margin: 10px auto;
    padding: 14px;
    background: #fef2f2;
    border: 1px solid #fca5a5;
    border-radius: 12px;
    color: #991b1b;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  html, body {
    margin: 0; padding: 0;
    background: #f3f5f8;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    color: #1f2430;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 4px 8px 4px 8px; }

  .top-row { display: flex; gap: 5px; margin-bottom: 4px; }

  .filter-btn {
    flex: 1;
    padding: 4px 6px;
    border-radius: 10px;
    border: 2px solid #111827;
    background: #fff;
    color: #111827;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .filter-btn.inactive {
    border-color: #d1d5db;
    color: #9ca3af;
    background: #f9fafb;
  }
  .filter-btn:active { background: #f3f4f6; }

  #copyImageBtn {
    flex: 1;
    padding: 4px 6px;
    border-radius: 10px;
    border: 2px solid #111827;
    background: #fff;
    color: #111827;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  #copyImageBtn:active { background: #f3f4f6; }
  #copyImageBtn[disabled] { opacity: 0.6; cursor: default; }

  .table-card {
    background: #fff;
    box-shadow: 0 2px 10px rgba(20,20,40,0.08);
    border: 1px solid #cbd2dd;
    overflow: hidden;
    border-radius: 4px;
  }
  table { width: 100%; border-collapse: collapse; table-layout: auto; }

  thead th {
    font-size: 11.5px;
    padding: 4px 2px;
    border: 1px solid #cbd2dd;
    white-space: nowrap;
  }
  thead th.col-group { background: #0b1c42; color: #fff; text-align: center; }
  thead th.col-item { background: #f8fafc; color: #111827; text-align: center; }
  thead th.col-normal { background: #f8fafc; color: #2563eb; text-align: center; }
  thead th.col-abnormal { background: #f8fafc; color: #dc2626; text-align: center; }

  tbody td {
    border: 1px solid #cbd2dd;
    padding: 0;
  }

  .group-cell {
    text-align: center;
    vertical-align: middle;
    font-weight: bold;
    font-size: 11.5px;
    padding: 2px 2px;
  }
  .group-cell.warranty { background: #dfeafc; color: #1d4ed8; }
  .group-cell.accident { background: #fbe1e2; color: #dc2626; }
  .group-cell .g-icon { display: block; margin: 0 auto 2px auto; width: 18px; height: 18px; }

  .item-cell { padding: 2px 4px; }
  .item-name { display: flex; align-items: center; gap: 6px; }
  .item-name .p-icon { flex: none; }
  .item-name .name-text { flex: 1; min-width: 0; }
  .item-name .name-text .nm { display: block; font-weight: bold; font-size: 12px; color: #000; line-height: 1.2; }
  .item-name .name-text .ds { display: block; color: #444; font-weight: normal; font-size: 10px; line-height: 1.2; margin-top: 1px; }

  .tapcell {
    width: 44px;
    height: 44px;
    text-align: center;
    vertical-align: middle;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    padding: 0;
  }
  .tapcell .mark {
    display: inline-block;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    box-sizing: border-box;
  }
  .tapcell.normal.selected .mark { border-color: #16a34a; background: #ecfdf5; }
  .tapcell.abnormal.selected .mark { border-color: #dc2626; background: #fef2f2; }
  .tapcell:active { background: #f1f5f9; }

  .empty-card {
    background: #fff;
    box-shadow: 0 2px 10px rgba(20,20,40,0.08);
    border: 1px solid #cbd2dd;
    border-radius: 4px;
    padding: 60px 20px;
    text-align: center;
    color: #9ca3af;
    font-size: 13.5px;
    line-height: 1.6;
  }

  .btn-row { display: flex; gap: 6px; margin-top: 4px; }
  .btn-row button {
    flex: 1;
    padding: 4px 0;
    font-size: 11.5px;
    font-weight: bold;
    border-radius: 9px;
    border: none;
    cursor: pointer;
  }
  #resetBtn { background: #e5e7eb; color: #374151; }
  #resetBtn:active { background: #d1d5db; }

  .car-number-group {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 8px;
    border-radius: 9px;
    background: #eef2ff;
    border: 1px solid #c7d2fe;
  }
  .car-number-group label {
    flex: none;
    font-size: 11px;
    font-weight: bold;
    color: #3730a3;
    white-space: nowrap;
  }
  .car-number-group input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-size: 12px;
    font-weight: bold;
    line-height: 1.3;
    color: #111827;
    padding: 4px 0;
    outline: none;
    text-align: center;
  }

  #captureArea { background: #f3f5f8; padding-top: 0; }

  .summary {
    margin-top: 3px;
    text-align: center;
    font-size: 10.5px;
    color: #6b7280;
  }
  .summary b { color: #111827; }
</style>
</head>
<body>
<noscript>
  <div class="noscript-warning">
    ⚠ 이 화면은 미리보기 상태라 정상 작동하지 않습니다.<br>
    파일을 <b>다른 앱으로 열기 → Chrome(또는 Safari)</b> 으로 다시 열어주세요.
  </div>
</noscript>
<div class="wrap" id="wrap">

  <div class="top-row" id="topRow">
    <button type="button" class="filter-btn" id="tabOutdoor">실외</button>
    <button type="button" class="filter-btn" id="tabIndoor">실내</button>
    <button type="button" id="copyImageBtn">이미지 저장</button>
  </div>

  <div id="captureArea">
    <div class="table-card" id="outdoorCard">
      <table>
        <colgroup>
          <col style="width:13%;">
          <col>
          <col style="width:44px;">
          <col style="width:44px;">
        </colgroup>
        <thead>
          <tr>
            <th class="col-group">구분</th>
            <th class="col-item">항목</th>
            <th class="col-normal">정상</th>
            <th class="col-abnormal">비정상</th>
          </tr>
        </thead>
        <tbody id="checklistBody"></tbody>
      </table>
    </div>

    <div class="empty-card" id="indoorCard" style="display:none;">
      실내 점검 항목은 추후 추가될 예정입니다.
    </div>

    <div class="summary" id="summary"></div>
  </div>

  <div class="btn-row">
    <button id="resetBtn">전체 초기화</button>
    <div class="car-number-group">
      <label for="carNumberInput">차번호</label>
      <input type="text" id="carNumberInput" placeholder="4자리" />
    </div>
  </div>
</div>

  var INDOOR_ITEMS = []; // 실내 항목은 추후 추가

  var STORAGE_KEY = "vehicleChecklistData";
  var state = {};
  var carNumber = "";
  var activeTab = "outdoor";

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state = (parsed && typeof parsed.checks === "object" && parsed.checks) ? parsed.checks : {};
        carNumber = (parsed && typeof parsed.carNumber === "string") ? parsed.carNumber : "";
      }
    } catch (e) {
      state = {};
      carNumber = "";
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ checks: state, carNumber: carNumber }));
    } catch (e) {}
  }

  function currentItems() {
    return activeTab === "outdoor" ? OUTDOOR_ITEMS : INDOOR_ITEMS;
  }

  function render() {
    document.getElementById("tabOutdoor").className = "filter-btn" + (activeTab === "outdoor" ? "" : " inactive");
    document.getElementById("tabIndoor").className = "filter-btn" + (activeTab === "indoor" ? "" : " inactive");

    document.getElementById("outdoorCard").style.display = activeTab === "outdoor" ? "" : "none";
    document.getElementById("indoorCard").style.display = activeTab === "indoor" ? "" : "none";

    renderTable();
    renderSummary();
  }

  function renderTable() {
    var body = document.getElementById("checklistBody");
    body.innerHTML = "";
    var items = OUTDOOR_ITEMS;
    var seenGroup = {};

    items.forEach(function (it) {
      var tr = document.createElement("tr");

      if (!seenGroup[it.group]) {
        seenGroup[it.group] = true;
        var span = items.filter(function (x) { return x.group === it.group; }).length;
        var gTd = document.createElement("td");
        gTd.rowSpan = span;
        gTd.className = "group-cell " + it.groupClass;
        gTd.innerHTML = (it.groupClass === "warranty" ? GICON.shield : GICON.crash) + "<div>" + it.group + "</div>";
        tr.appendChild(gTd);
      }

      var itemTd = document.createElement("td");
      itemTd.className = "item-cell";
      var nameDiv = document.createElement("div");
      nameDiv.className = "item-name";
      nameDiv.innerHTML = it.icon +
        '<span class="name-text"><span class="nm">' + it.name + '</span><span class="ds">(' + it.desc + ')</span></span>';
      itemTd.appendChild(nameDiv);
      tr.appendChild(itemTd);

      tr.appendChild(makeCell(it.id, "normal"));
      tr.appendChild(makeCell(it.id, "abnormal"));

      body.appendChild(tr);
    });
  }

  function makeCell(id, kind) {
    var td = document.createElement("td");
    td.className = "tapcell " + kind;
    if (state[id] === kind) td.className += " selected";
    var mark = document.createElement("span");
    mark.className = "mark";
    td.appendChild(mark);
    td.onclick = function () { onTap(id, kind); };
    return td;
  }

  function onTap(id, kind) {
    if (state[id] === kind) {
      delete state[id];
    } else {
      state[id] = kind;
    }
    saveData();
    render();
  }

  function renderSummary() {
    var items = currentItems();
    var total = items.length;
    var checked = 0, abnormal = 0;
    items.forEach(function (it) {
      if (state[it.id]) checked++;
      if (state[it.id] === "abnormal") abnormal++;
    });
    if (total === 0) {
      document.getElementById("summary").innerHTML = "";
      return;
    }
    document.getElementById("summary").innerHTML =
      "점검 완료: <b>" + checked + "</b> / " + total +
      "&nbsp;&nbsp;·&nbsp;&nbsp;비정상: <b>" + abnormal + "</b>건";
  }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function isAndroid() {
    return /Android/.test(navigator.userAgent);
  }

  function openImageForCopyFallback(dataUrl, filename) {
    var win = window.open("", "_blank");
    if (!win) {
      var a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return;
    }
    win.document.write(
      "<!DOCTYPE html><html><head><meta charset='utf-8'><title>" + filename + "</title>" +
      "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" +
      "<style>body{margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;}" +
      "p{color:#fff;font-size:14px;line-height:1.5;text-align:center;padding:14px 16px;margin:0;background:#1f2430;}" +
      "img{width:100%;display:block;}</style></head><body>" +
      "<p>👇 이미지를 <b>길게 눌러</b> <b>'이미지 저장'</b>을 선택하면 갤러리에 저장됩니다.</p>" +
      "<img src='" + dataUrl + "' alt='" + filename + "'>" +
      "</body></html>"
    );
    win.document.close();
  }

  function downloadBlobDirect(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function copyImageToClipboardFallback(blob, canvas, filename, finish) {
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
        .then(function () {
          alert("이미지가 클립보드에 복사되었습니다. 원하는 곳에 붙여넣기(Ctrl+V) 하세요.");
          finish();
        })
        .catch(function () {
          openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
          finish();
        });
    } else {
      openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
      finish();
    }
  }

  function shareOrCopyImage() {
    var btn = document.getElementById("copyImageBtn");
    if (typeof html2canvas === "undefined") {
      alert("이미지 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.");
      return;
    }
    var target = document.getElementById("wrap");
    var originalLabel = btn.textContent;
    var filename = "차량점검.png";

    function finish() {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }

    html2canvas(target, {
      backgroundColor: "#f3f5f8",
      scale: Math.max(2, window.devicePixelRatio || 1),
      useCORS: true,
      scrollX: 0,
      scrollY: -window.scrollY
    }).then(function (canvas) {
      btn.disabled = true;
      btn.textContent = "처리 중...";
      canvas.toBlob(function (blob) {
        if (!blob) {
          alert("이미지 생성에 실패했습니다.");
          finish();
          return;
        }

        if (isAndroid()) {
          downloadBlobDirect(blob, filename);
          finish();
          return;
        }

        var file = new File([blob], filename, { type: "image/png" });

        if (isIOS()) {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "차량 점검 체크리스트" })
              .then(finish)
              .catch(function () {
                openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
                finish();
              });
          } else {
            openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
            finish();
          }
          return;
        }

        copyImageToClipboardFallback(blob, canvas, filename, finish);
      }, "image/png");
    }).catch(function (err) {
      alert("이미지 생성에 실패했습니다: " + err);
      finish();
    });
  }

  document.getElementById("copyImageBtn").onclick = shareOrCopyImage;

  document.getElementById("tabOutdoor").onclick = function () { activeTab = "outdoor"; render(); };
  document.getElementById("tabIndoor").onclick = function () { activeTab = "indoor"; render(); };

  document.getElementById("resetBtn").onclick = function () {
    state = {};
    carNumber = "";
    document.getElementById("carNumberInput").value = "";
    saveData();
    render();
  };
  document.getElementById("carNumberInput").oninput = function () {
    carNumber = this.value;
    saveData();
  };

  loadData();
  document.getElementById("carNumberInput").value = carNumber;
  render();
</script>
</body>
</html>
