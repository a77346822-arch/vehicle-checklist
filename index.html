<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>차량 점검 체크리스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .noscript-warning {
    max-width: 520px;
    margin: 10px auto;
    padding: 14px;
    background: #fef2f2;
    border: 1px solid #fca5a5;
    border-radius: 12px;
    color: #991b1b;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  html, body {
    margin: 0; padding: 0;
    background: #f3f5f8;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    color: #1f2430;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 10px 10px 14px 10px; }

  h1 {
    font-size: 16px;
    text-align: center;
    margin: 3px 0 10px 0;
    color: #111827;
  }

  .top-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .filter-btn {
    flex: none;
    padding: 8px 10px;
    border-radius: 10px;
    border: 2px solid #111827;
    background: #fff;
    color: #111827;
    font-size: 12.5px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-btn.inactive {
    border-color: #d1d5db;
    color: #9ca3af;
    background: #f9fafb;
  }
  .filter-btn:active { background: #f3f4f6; }

  #copyImageBtn {
    flex: 1;
    padding: 8px 16px;
    border-radius: 10px;
    border: 2px solid #111827;
    background: #fff;
    color: #111827;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  #copyImageBtn:active { background: #f3f4f6; }
  #copyImageBtn[disabled] { opacity: 0.6; cursor: default; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    z-index: 1000;
    overflow: auto;
    padding: 50px 12px 20px 12px;
    box-sizing: border-box;
    text-align: center;
  }
  .modal-overlay.open { display: block; }
  .modal-overlay img {
    max-width: 100%;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
  }
  .modal-close {
    position: fixed;
    top: 10px;
    right: 12px;
    z-index: 1001;
    padding: 8px 14px;
    border: none;
    border-radius: 20px;
    background: #fff;
    color: #111827;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .table-card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(20,20,40,0.08);
    border: 1px solid #e5e7eb;
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1px solid #d1d5db; }
  thead th {
    background: #f8fafc;
    color: #374151;
    font-size: 12px;
    padding: 7px 4px;
    border: 1px solid #d1d5db;
  }
  thead th:nth-child(1) { width: 60%; text-align: center; }
  thead th:nth-child(2), thead th:nth-child(3) { width: 20%; text-align: center; }

  tbody td {
    border: 1px solid #d1d5db;
    padding: 0;
  }

  .item-name {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 12px;
    line-height: 1.25;
    padding: 8px 4px;
    color: #000000;
    overflow: hidden;
  }
  .item-name .name-static {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  .empty-row { padding: 22px 14px; text-align: center; color: #9ca3af; font-size: 13px; }

  .tapcell {
    height: 42px;
    text-align: center;
    vertical-align: middle;
    cursor: pointer;
    border-left: 1px solid #eef0f4;
    user-select: none;
    touch-action: manipulation;
  }
  .tapcell .mark {
    display: inline-block;
    width: 24px; height: 24px;
    line-height: 24px;
    font-size: 17px;
    font-weight: bold;
    color: transparent;
  }
  .tapcell.normal.selected { background: #ecfdf5; }
  .tapcell.normal.selected .mark { color: #16a34a; }
  .tapcell.abnormal.selected { background: #fef2f2; }
  .tapcell.abnormal.selected .mark { color: #dc2626; }
  .tapcell:active { background: #f1f5f9; }

  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row button {
    flex: 1;
    padding: 9px 0;
    font-size: 13px;
    font-weight: bold;
    border-radius: 9px;
    border: none;
    cursor: pointer;
  }
  #resetBtn { background: #e5e7eb; color: #374151; }
  #resetBtn:active { background: #d1d5db; }

  .car-number-group {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    border-radius: 9px;
    background: #eef2ff;
    border: 1px solid #c7d2fe;
  }
  .car-number-group label {
    flex: none;
    font-size: 12.5px;
    font-weight: bold;
    color: #3730a3;
    white-space: nowrap;
  }
  .car-number-group input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-size: 13.5px;
    font-weight: bold;
    line-height: 1.6;
    color: #111827;
    padding: 11px 0 13px 0;
    outline: none;
    text-align: center;
  }

  #captureArea { background: #f3f5f8; padding-top: 2px; }

  .summary {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    color: #6b7280;
  }
  .summary b { color: #111827; }
</style>
</head>
<body>
<noscript>
  <div class="noscript-warning">
    ⚠ 이 화면은 미리보기 상태라 정상 작동하지 않습니다.<br>
    파일을 <b>다른 앱으로 열기 → Chrome(또는 Safari)</b> 으로 다시 열어주세요.
  </div>
</noscript>
<div class="wrap" id="wrap">
  <h1>차량 점검 체크리스트</h1>

  <div class="top-row" id="topRow"></div>

  <div id="captureArea">
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>항목</th>
            <th>정상</th>
            <th>비정상</th>
          </tr>
        </thead>
        <tbody id="checklistBody"></tbody>
      </table>
    </div>

    <div class="summary" id="summary"></div>
  </div>

  <div class="btn-row">
    <button id="resetBtn">전체 초기화</button>
    <div class="car-number-group">
      <label for="carNumberInput">차번호</label>
      <input type="text" id="carNumberInput" placeholder="4자리" />
    </div>
  </div>
</div>

<div class="modal-overlay" id="defectModal">
  <button type="button" class="modal-close" id="defectModalClose">✕ 닫기</button>
  <img src="외관.jpg" alt="결함 이미지 예시" id="defectImg">
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
  var DEFAULT_ITEMS = [
    { category: "실외", items: ["전조등 변색", "타이어 마모", "키드니 그릴 벗겨짐 ( G60 )", "휠 부식"] },
    { category: "실내", items: ["시트커버 불량 (균열/겹쳐짐)", "에어백 주름"] }
  ];

  // 아래 DEFAULT_ITEMS 목록을 수정할 때마다 이 숫자를 1씩 올려주세요.
  // 그러면 이미 사용 중이던 기기에 저장된 예전 항목 목록 대신 새 목록으로 자동 갱신됩니다.
  var ITEMS_VERSION = 4;

  var STORAGE_KEY = "vehicleChecklistData";

  var ITEMS = [];
  var state = {};
  var carNumber = "";
  var activeCategory = null;

  function isValidItems(x) {
    return Array.isArray(x) && x.every(function (c) {
      return c && typeof c.category === "string" && Array.isArray(c.items) &&
        c.items.every(function (n) { return typeof n === "string"; });
    });
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed.itemsVersion === ITEMS_VERSION && isValidItems(parsed.items)) {
          // 코드의 항목 목록과 버전이 같으면 저장된 목록 사용
          ITEMS = parsed.items;
        } else {
          // 버전이 다르면(코드의 기본 항목이 바뀌었으면) 최신 기본 목록으로 갱신
          ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
        }
        state = parsed.checks || {};
        carNumber = typeof parsed.carNumber === "string" ? parsed.carNumber : "";
      } else {
        ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
        state = {};
        carNumber = "";
      }
    } catch (e) {
      ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      state = {};
      carNumber = "";
    }
    if (!activeCategory || !ITEMS.some(function (cat) { return cat.category === activeCategory; })) {
      activeCategory = ITEMS.length > 0 ? ITEMS[0].category : null;
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: ITEMS, checks: state, carNumber: carNumber, itemsVersion: ITEMS_VERSION }));
    } catch (e) {}
  }

  function allNames() {
    var names = [];
    ITEMS.forEach(function (cat) { cat.items.forEach(function (n) { names.push(n); }); });
    return names;
  }

  function renderTopRow() {
    var row = document.getElementById("topRow");
    row.innerHTML = "";

    ITEMS.forEach(function (cat) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "filter-btn" + (activeCategory === cat.category ? "" : " inactive");
      btn.textContent = cat.category;
      btn.onclick = function () {
        activeCategory = cat.category;
        render();
      };
      row.appendChild(btn);
    });

    var defectBtn = document.createElement("button");
    defectBtn.type = "button";
    defectBtn.className = "filter-btn";
    defectBtn.textContent = "결함 이미지";
    defectBtn.onclick = openDefectModal;
    row.appendChild(defectBtn);

    var copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.id = "copyImageBtn";
    copyBtn.textContent = "이미지 저장";
    copyBtn.onclick = shareOrCopyImage;
    row.appendChild(copyBtn);
  }

  function render() {
    renderTopRow();

    var body = document.getElementById("checklistBody");
    body.innerHTML = "";

    var visibleItems = [];
    ITEMS.forEach(function (cat) {
      if (cat.category !== activeCategory) return;
      cat.items.forEach(function (name) { visibleItems.push(name); });
    });

    if (visibleItems.length === 0) {
      var tr0 = document.createElement("tr");
      var td0 = document.createElement("td");
      td0.colSpan = 3;
      td0.className = "empty-row";
      td0.textContent = "표시할 점검 항목이 없습니다.";
      tr0.appendChild(td0);
      body.appendChild(tr0);
      renderSummary();
      return;
    }

    visibleItems.forEach(function (name) {
      var tr = document.createElement("tr");

      var nameTd = document.createElement("td");
      var nameDiv = document.createElement("div");
      nameDiv.className = "item-name";

      var nameStatic = document.createElement("span");
      nameStatic.className = "name-static";
      nameStatic.textContent = name;
      nameDiv.appendChild(nameStatic);

      nameTd.appendChild(nameDiv);
      tr.appendChild(nameTd);

      tr.appendChild(makeCell(name, "normal"));
      tr.appendChild(makeCell(name, "abnormal"));

      body.appendChild(tr);
    });

    renderSummary();
  }

  function makeCell(name, kind) {
    var td = document.createElement("td");
    td.className = "tapcell " + kind;
    if (state[name] === kind) td.className += " selected";
    var mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = "O";
    td.appendChild(mark);
    td.onclick = function () { onTap(name, kind); };
    return td;
  }

  function onTap(name, kind) {
    if (state[name] === kind) {
      delete state[name];
    } else {
      state[name] = kind;
    }
    saveData();
    render();
  }

  function renderSummary() {
    var total = allNames().length;
    var checked = Object.keys(state).length;
    var abnormal = 0;
    for (var k in state) if (state[k] === "abnormal") abnormal++;
    document.getElementById("summary").innerHTML =
      "점검 완료: <b>" + checked + "</b> / " + total +
      "&nbsp;&nbsp;·&nbsp;&nbsp;비정상: <b>" + abnormal + "</b>건";
  }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function isAndroid() {
    return /Android/.test(navigator.userAgent);
  }

  function openImageForCopyFallback(dataUrl, filename) {
    var win = window.open("", "_blank");
    if (!win) {
      var a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return;
    }
    win.document.write(
      "<!DOCTYPE html><html><head><meta charset='utf-8'><title>" + filename + "</title>" +
      "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" +
      "<style>body{margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;}" +
      "p{color:#fff;font-size:14px;line-height:1.5;text-align:center;padding:14px 16px;margin:0;background:#1f2430;}" +
      "img{width:100%;display:block;}</style></head><body>" +
      "<p>👇 이미지를 <b>길게 눌러</b> <b>'이미지 저장'</b>을 선택하면 갤러리에 저장됩니다.</p>" +
      "<img src='" + dataUrl + "' alt='" + filename + "'>" +
      "</body></html>"
    );
    win.document.close();
  }

  function downloadBlobDirect(blob, filename) {
    // 다운로드 폴더에 즉시 저장 (별도 시트 없음).
    // 안드로이드는 다운로드 폴더가 갤러리(사진) 앱에도 자동으로 함께 표시됩니다.
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function copyImageToClipboardFallback(blob, canvas, filename, finish) {
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
        .then(function () {
          alert("이미지가 클립보드에 복사되었습니다. 원하는 곳에 붙여넣기(Ctrl+V) 하세요.");
          finish();
        })
        .catch(function () {
          openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
          finish();
        });
    } else {
      openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
      finish();
    }
  }

  function shareOrCopyImage() {
    var btn = document.getElementById("copyImageBtn");
    if (typeof html2canvas === "undefined") {
      alert("이미지 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.");
      return;
    }
    // 화면에 실제로 보이는 전체 영역(제목, 탭 버튼, 표, 요약, 하단 버튼까지)을 그대로 캡처
    var target = document.getElementById("wrap");
    var originalLabel = btn.textContent;
    var filename = "차량점검.png";

    function finish() {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }

    // 버튼 문구를 바꾸기 전에 먼저 캡처해서, "처리 중..." 글자가 이미지에 찍히지 않도록 함
    html2canvas(target, {
      backgroundColor: "#f3f5f8",
      scale: Math.max(2, window.devicePixelRatio || 1),
      useCORS: true,
      windowWidth: document.documentElement.scrollWidth,
      windowHeight: document.documentElement.scrollHeight
    }).then(function (canvas) {
      btn.disabled = true;
      btn.textContent = "처리 중...";
      canvas.toBlob(function (blob) {
        if (!blob) {
          alert("이미지 생성에 실패했습니다.");
          finish();
          return;
        }

        if (isAndroid()) {
          // 안드로이드: 공유/클립보드 API가 기기마다 불안정하므로,
          // 항상 성공하는 직접 다운로드 방식 사용 (다운로드 폴더 = 갤러리에 표시됨)
          downloadBlobDirect(blob, filename);
          finish();
          return;
        }

        var file = new File([blob], filename, { type: "image/png" });

        if (isIOS()) {
          // 아이폰은 공유 시트에서 "이미지 저장"을 눌러야 사진 앱에 저장됨 (OS 정책상 우회 불가)
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "차량 점검 체크리스트" })
              .then(finish)
              .catch(function () {
                openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
                finish();
              });
          } else {
            openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
            finish();
          }
          return;
        }

        // PC 등 기타 환경: 클립보드 복사 우선, 실패 시 다운로드
        copyImageToClipboardFallback(blob, canvas, filename, finish);
      }, "image/png");
    }).catch(function (err) {
      alert("이미지 생성에 실패했습니다: " + err);
      finish();
    });
  }

  function openDefectModal() {
    document.getElementById("defectModal").classList.add("open");
  }
  function closeDefectModal() {
    document.getElementById("defectModal").classList.remove("open");
  }

  document.getElementById("resetBtn").onclick = function () {
    state = {};
    carNumber = "";
    document.getElementById("carNumberInput").value = "";
    saveData();
    render();
  };
  document.getElementById("carNumberInput").oninput = function () {
    carNumber = this.value;
    saveData();
  };
  document.getElementById("defectModalClose").onclick = closeDefectModal;
  document.getElementById("defectModal").onclick = function (e) {
    if (e.target === this) closeDefectModal();
  };

  loadData();
  document.getElementById("carNumberInput").value = carNumber;
  render();
</script>
</body>
</html>
