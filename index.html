<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>차량 점검 체크리스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .noscript-warning {
    max-width: 560px;
    margin: 10px auto;
    padding: 14px;
    background: #fef2f2;
    border: 1px solid #fca5a5;
    border-radius: 12px;
    color: #991b1b;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  html, body {
    margin: 0; padding: 0;
    background: #f3f5f8;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    color: #1f2430;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 10px 14px 14px 14px; }

  h1 {
    font-size: 16px;
    text-align: center;
    margin: 3px 0 10px 0;
    color: #111827;
  }

  .car-number-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    margin-bottom: 10px;
    border-radius: 9px;
    background: #eef2ff;
    border: 1px solid #c7d2fe;
  }
  .car-number-group label {
    flex: none;
    font-size: 12.5px;
    font-weight: bold;
    color: #3730a3;
    white-space: nowrap;
  }
  .car-number-group input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-size: 13.5px;
    font-weight: bold;
    line-height: 1.6;
    color: #111827;
    padding: 10px 0 11px 0;
    outline: none;
    text-align: center;
  }

  #captureArea { background: #f3f5f8; }

  .table-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(20,20,40,0.08);
    border: 1px solid #e5e7eb;
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  table { border-collapse: collapse; width: 100%; min-width: 520px; }

  thead th {
    background: #f8fafc;
    color: #111827;
    font-size: 12.5px;
    font-weight: bold;
    padding: 9px 4px;
    border-bottom: 2px solid #e5e7eb;
    text-align: center;
    white-space: nowrap;
  }
  thead th.th-cat { background: #1e3a6e; color: #fff; }
  thead th.th-normal { color: #1d4ed8; }
  thead th.th-abnormal { color: #dc2626; }

  col.col-cat { width: 60px; }
  col.col-item { width: 190px; }
  col.col-normal { width: 56px; }
  col.col-abnormal { width: 56px; }
  col.col-note { width: 130px; }

  td.cat-cell {
    text-align: center;
    vertical-align: middle;
    font-size: 13px;
    font-weight: bold;
    padding: 8px 4px;
    border-right: 1px solid #e5e7eb;
  }
  td.cat-cell.warranty { background: #eaf2fb; color: #1d4ed8; }
  td.cat-cell.accident { background: #fbe9ea; color: #dc2626; }
  td.cat-cell .cat-icon { width: 26px; height: 26px; margin: 0 auto 4px auto; }

  td.item-cell {
    padding: 8px 8px;
    border-top: 1px solid #f1f3f6;
    border-right: 1px solid #f1f3f6;
  }
  .item-inner { display: flex; align-items: center; gap: 8px; }
  .item-icon {
    flex: none;
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: #4b5563;
    background: #f3f4f6;
  }
  .warranty-row .item-icon { color: #1d4ed8; background: #eaf2fb; }
  .accident-row .item-icon { color: #dc2626; background: #fbe9ea; }
  .item-name { font-size: 13px; font-weight: bold; color: #111827; line-height: 1.3; }

  td.tapcell {
    border-top: 1px solid #f1f3f6;
    border-right: 1px solid #f1f3f6;
    text-align: center;
    padding: 6px 4px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
  }
  td.tapcell .mark {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 26px; height: 26px;
    border-radius: 7px;
    font-size: 14px; font-weight: bold;
    border: 1.5px solid #e5e7eb;
    color: transparent;
  }
  td.tapcell.normal.selected .mark { background: #ecfdf5; border-color: #16a34a; color: #16a34a; }
  td.tapcell.abnormal.selected .mark { background: #fef2f2; border-color: #dc2626; color: #dc2626; }
  td.tapcell:active .mark { background: #f1f5f9; }

  td.note-cell { padding: 6px 6px; border-top: 1px solid #f1f3f6; }
  td.note-cell input {
    width: 100%;
    font-size: 12px;
    padding: 6px 7px;
    border: 1px solid #e5e7eb;
    border-radius: 7px;
    outline: none;
    color: #374151;
    background: #fafafa;
  }
  td.note-cell input:focus { border-color: #9ca3af; background: #fff; }

  .summary {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    color: #6b7280;
  }
  .summary b { color: #111827; }

  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row button {
    flex: 1;
    padding: 9px 0;
    font-size: 13px;
    font-weight: bold;
    border-radius: 9px;
    border: 2px solid #111827;
    background: #fff;
    color: #111827;
    cursor: pointer;
  }
  .btn-row button:active { background: #f3f4f6; }
  #copyImageBtn[disabled] { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<noscript>
  <div class="noscript-warning">
    ⚠ 이 화면은 미리보기 상태라 정상 작동하지 않습니다.<br>
    파일을 <b>다른 앱으로 열기 → Chrome(또는 Safari)</b> 으로 다시 열어주세요.
  </div>
</noscript>
<div class="wrap" id="wrap">
  <h1>차량 점검 체크리스트</h1>

  <div class="car-number-group">
    <label for="carNumberInput">차번호</label>
    <input type="text" id="carNumberInput" placeholder="4자리" />
  </div>

  <div id="captureArea">
    <div class="table-card">
      <div class="table-scroll">
        <table>
          <colgroup>
            <col class="col-cat"><col class="col-item"><col class="col-normal"><col class="col-abnormal"><col class="col-note">
          </colgroup>
          <thead>
            <tr>
              <th class="th-cat">구분</th>
              <th>항목</th>
              <th class="th-normal">정상</th>
              <th class="th-abnormal">비정상</th>
              <th>비고</th>
            </tr>
          </thead>
          <tbody id="checklistBody"></tbody>
        </table>
      </div>
    </div>

    <div class="summary" id="summary"></div>
  </div>

  <div class="btn-row">
    <button id="resetBtn">전체 초기화</button>
    <button id="copyImageBtn">이미지 저장</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
  var ICONS = {
    headlight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11.2c.6.4 1 1.1 1 1.8h4c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>',
    grille: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M3 14h18M9 6v12M15 6v12"/></svg>',
    wheel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>',
    bumper: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l1.5-5A2 2 0 0 1 7.4 9.5h9.2a2 2 0 0 1 1.9 1.5L20 16"/><rect x="3" y="16" width="18" height="4" rx="1"/><circle cx="7.5" cy="20" r="1.3"/><circle cx="16.5" cy="20" r="1.3"/></svg>',
    door: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 12h.01"/></svg>',
    fender: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M4 17h16"/><circle cx="12" cy="17" r="2"/></svg>',
    glass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2-8a2 2 0 0 1 2-1.5h10A2 2 0 0 1 19 7l2 8"/><path d="M3 15h18"/></svg>'
  };

  var DEFAULT_CATEGORIES = [
    {
      key: "보증", cls: "warranty", icon: "shield",
      items: [
        { name: "전조등 변색", icon: "headlight" },
        { name: "키드니 그릴 벗겨짐", icon: "grille" },
        { name: "휠 부식", icon: "wheel" }
      ]
    },
    {
      key: "사고", cls: "accident", icon: "alert",
      items: [
        { name: "앞유리 손상", icon: "glass" },
        { name: "범퍼 손상", icon: "bumper" },
        { name: "도어 손상", icon: "door" },
        { name: "휀다 손상", icon: "fender" },
        { name: "휠/타이어 손상", icon: "wheel" }
      ]
    }
  ];

  // DEFAULT_CATEGORIES 목록을 수정할 때마다 이 숫자를 1씩 올려주세요.
  var ITEMS_VERSION = 6;
  var STORAGE_KEY = "vehicleChecklistData";

  var CATEGORIES = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  var state = {};
  var notes = {};
  var carNumber = "";

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state = parsed.checks || {};
        notes = parsed.notes || {};
        carNumber = typeof parsed.carNumber === "string" ? parsed.carNumber : "";
        if (parsed.itemsVersion !== ITEMS_VERSION) {
          CATEGORIES = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
        }
      }
    } catch (e) {
      state = {}; notes = {}; carNumber = "";
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        checks: state, notes: notes, carNumber: carNumber, itemsVersion: ITEMS_VERSION
      }));
    } catch (e) {}
  }

  function allNames() {
    var names = [];
    CATEGORIES.forEach(function (cat) { cat.items.forEach(function (it) { names.push(it.name); }); });
    return names;
  }

  function render() {
    var body = document.getElementById("checklistBody");
    body.innerHTML = "";

    CATEGORIES.forEach(function (cat) {
      cat.items.forEach(function (it, idx) {
        var tr = document.createElement("tr");
        tr.className = cat.cls + "-row";

        if (idx === 0) {
          var catTd = document.createElement("td");
          catTd.className = "cat-cell " + cat.cls;
          catTd.rowSpan = cat.items.length;
          catTd.innerHTML = '<div class="cat-icon">' + ICONS[cat.icon] + '</div><div>' + cat.key + '</div>';
          tr.appendChild(catTd);
        }

        var itemTd = document.createElement("td");
        itemTd.className = "item-cell";
        itemTd.innerHTML =
          '<div class="item-inner"><div class="item-icon">' + ICONS[it.icon] + '</div>' +
          '<div class="item-name">' + it.name + '</div></div>';
        tr.appendChild(itemTd);

        tr.appendChild(makeCell(it.name, "normal"));
        tr.appendChild(makeCell(it.name, "abnormal"));

        var noteTd = document.createElement("td");
        noteTd.className = "note-cell";
        var noteInput = document.createElement("input");
        noteInput.type = "text";
        noteInput.placeholder = "내용 입력";
        noteInput.value = notes[it.name] || "";
        noteInput.oninput = function () {
          notes[it.name] = this.value;
          saveData();
        };
        noteTd.appendChild(noteInput);
        tr.appendChild(noteTd);

        body.appendChild(tr);
      });
    });

    renderSummary();
  }

  function makeCell(name, kind) {
    var td = document.createElement("td");
    td.className = "tapcell " + kind + (state[name] === kind ? " selected" : "");
    var mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = "O";
    td.appendChild(mark);
    td.onclick = function () { onTap(name, kind); };
    return td;
  }

  function onTap(name, kind) {
    if (state[name] === kind) delete state[name];
    else state[name] = kind;
    saveData();
    render();
  }

  function renderSummary() {
    var total = allNames().length;
    var checked = Object.keys(state).length;
    var abnormal = 0;
    for (var k in state) if (state[k] === "abnormal") abnormal++;
    document.getElementById("summary").innerHTML =
      "점검 완료: <b>" + checked + "</b> / " + total +
      "&nbsp;&nbsp;·&nbsp;&nbsp;비정상: <b>" + abnormal + "</b>건";
  }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function isAndroid() { return /Android/.test(navigator.userAgent); }

  function openImageForCopyFallback(dataUrl, filename) {
    var win = window.open("", "_blank");
    if (!win) {
      var a = document.createElement("a");
      a.href = dataUrl; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      return;
    }
    win.document.write(
      "<!DOCTYPE html><html><head><meta charset='utf-8'><title>" + filename + "</title>" +
      "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" +
      "<style>body{margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;}" +
      "p{color:#fff;font-size:14px;line-height:1.5;text-align:center;padding:14px 16px;margin:0;background:#1f2430;}" +
      "img{width:100%;display:block;}</style></head><body>" +
      "<p>👇 이미지를 <b>길게 눌러</b> <b>'이미지 저장'</b>을 선택하면 갤러리에 저장됩니다.</p>" +
      "<img src='" + dataUrl + "' alt='" + filename + "'>" +
      "</body></html>"
    );
    win.document.close();
  }

  function downloadBlobDirect(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function copyImageToClipboardFallback(blob, canvas, filename, finish) {
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
        .then(function () {
          alert("이미지가 클립보드에 복사되었습니다. 원하는 곳에 붙여넣기(Ctrl+V) 하세요.");
          finish();
        })
        .catch(function () {
          openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
          finish();
        });
    } else {
      openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
      finish();
    }
  }

  function shareOrCopyImage() {
    var btn = document.getElementById("copyImageBtn");
    if (typeof html2canvas === "undefined") {
      alert("이미지 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.");
      return;
    }
    var target = document.getElementById("wrap");
    var originalLabel = btn.textContent;
    var filename = "차량점검.png";

    function finish() { btn.disabled = false; btn.textContent = originalLabel; }

    html2canvas(target, {
      backgroundColor: "#f3f5f8",
      scale: Math.max(2, window.devicePixelRatio || 1),
      useCORS: true, scrollX: 0, scrollY: -window.scrollY
    }).then(function (canvas) {
      btn.disabled = true; btn.textContent = "처리 중...";
      canvas.toBlob(function (blob) {
        if (!blob) { alert("이미지 생성에 실패했습니다."); finish(); return; }

        if (isAndroid()) { downloadBlobDirect(blob, filename); finish(); return; }

        var file = new File([blob], filename, { type: "image/png" });

        if (isIOS()) {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "차량 점검 체크리스트" })
              .then(finish)
              .catch(function () {
                openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
                finish();
              });
          } else {
            openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
            finish();
          }
          return;
        }

        copyImageToClipboardFallback(blob, canvas, filename, finish);
      }, "image/png");
    }).catch(function (err) {
      alert("이미지 생성에 실패했습니다: " + err);
      finish();
    });
  }

  document.getElementById("resetBtn").onclick = function () {
    state = {}; notes = {}; carNumber = "";
    document.getElementById("carNumberInput").value = "";
    saveData();
    render();
  };
  document.getElementById("carNumberInput").oninput = function () {
    carNumber = this.value;
    saveData();
  };
  document.getElementById("copyImageBtn").onclick = shareOrCopyImage;

  loadData();
  document.getElementById("carNumberInput").value = carNumber;
  render();
</script>
</body>
</html>
