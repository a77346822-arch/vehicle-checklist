<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>차량 점검 체크리스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .noscript-warning {
    max-width: 520px;
    margin: 10px auto;
    padding: 14px;
    background: #fef2f2;
    border: 1px solid #fca5a5;
    border-radius: 12px;
    color: #991b1b;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  html, body {
    margin: 0; padding: 0;
    background: #f3f5f8;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    color: #1f2430;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 10px 10px 14px 10px; }

  h1 {
    font-size: 16px;
    text-align: center;
    margin: 3px 0 10px 0;
    color: #111827;
  }

  .table-card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(20,20,40,0.08);
    border: 1px solid #e5e7eb;
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1px solid #d1d5db; }
  thead th {
    background: #f8fafc;
    color: #374151;
    font-size: 12px;
    padding: 7px 4px;
    border: 1px solid #d1d5db;
  }
  thead th:nth-child(1) { width: 10%; text-align: center; }
  thead th:nth-child(2) { width: 56%; text-align: center; }
  thead th:nth-child(3), thead th:nth-child(4) { width: 17%; text-align: center; }

  tbody td {
    border: 1px solid #d1d5db;
    padding: 0;
  }

  .category-cell {
    text-align: center;
    vertical-align: middle;
    font-weight: bold;
    font-size: 12.5px;
    color: #374151;
    background: #f8fafc;
    border: 2px solid #d1d5db;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 2px;
    padding: 6px 0 !important;
  }

  .item-name {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 12px;
    line-height: 1.25;
    padding: 8px 4px;
    color: #000000;
    overflow: hidden;
  }
  .item-name .name-static {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  .empty-row { padding: 22px 14px; text-align: center; color: #9ca3af; font-size: 13px; }

  .tapcell {
    height: 42px;
    text-align: center;
    vertical-align: middle;
    cursor: pointer;
    border-left: 1px solid #eef0f4;
    user-select: none;
    touch-action: manipulation;
  }
  .tapcell .mark {
    display: inline-block;
    width: 24px; height: 24px;
    line-height: 24px;
    font-size: 17px;
    font-weight: bold;
    color: transparent;
  }
  .tapcell.normal.selected { background: #ecfdf5; }
  .tapcell.normal.selected .mark { color: #16a34a; }
  .tapcell.abnormal.selected { background: #fef2f2; }
  .tapcell.abnormal.selected .mark { color: #dc2626; }
  .tapcell:active { background: #f1f5f9; }

  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row button {
    flex: 1;
    padding: 9px 0;
    font-size: 13px;
    font-weight: bold;
    border-radius: 9px;
    border: none;
    cursor: pointer;
  }
  #resetBtn { background: #e5e7eb; color: #374151; }
  #resetBtn:active { background: #d1d5db; }

  .car-number-group {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    border-radius: 9px;
    background: #eef2ff;
    border: 1px solid #c7d2fe;
  }
  .car-number-group label {
    flex: none;
    font-size: 12.5px;
    font-weight: bold;
    color: #3730a3;
    white-space: nowrap;
  }
  .car-number-group input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-size: 13.5px;
    font-weight: bold;
    color: #111827;
    padding: 9px 0;
    outline: none;
    text-align: center;
  }

  #captureArea { background: #f3f5f8; padding-top: 2px; }

  .summary {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    color: #6b7280;
  }
  .summary b { color: #111827; }
</style>
</head>
<body>
<noscript>
  <div class="noscript-warning">
    ⚠ 이 화면은 미리보기 상태라 정상 작동하지 않습니다.<br>
    파일을 <b>다른 앱으로 열기 → Chrome(또는 Safari)</b> 으로 다시 열어주세요.
  </div>
</noscript>
<div class="wrap">
  <div id="captureArea">
    <h1>차량 점검 체크리스트</h1>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>구분</th>
            <th>항목</th>
            <th>정상</th>
            <th>비정상</th>
          </tr>
        </thead>
        <tbody id="checklistBody"></tbody>
      </table>
    </div>

    <div class="summary" id="summary"></div>
  </div>

  <div class="btn-row">
    <button id="resetBtn">전체 초기화</button>
    <div class="car-number-group">
      <label for="carNumberInput">차번호</label>
      <input type="text" id="carNumberInput" placeholder="4자리" />
    </div>
  </div>
</div>

<script>
  var DEFAULT_ITEMS = [
    { category: "실외", brands: [
      { brand: "ALL", items: ["전조등 변색", "타이어 마모"] },
      { brand: "BMW", items: ["키드니 그릴 벗겨짐 ( G60 )", "선루프 몰딩 변형 ( X시리즈 )", "휠 부식"] },
      { brand: "MINI", items: [] }
    ]},
    { category: "실내", brands: [
      { brand: "ALL", items: ["시트 커버 불량(균열 / 겹쳐짐)"] },
      { brand: "BMW", items: ["에어백 주름"] }
    ]}
  ];

  // 아래 DEFAULT_ITEMS 목록을 수정할 때마다 이 숫자를 1씩 올려주세요.
  // 그러면 이미 사용 중이던 기기에 저장된 예전 항목 목록 대신 새 목록으로 자동 갱신됩니다.
  var ITEMS_VERSION = 3;


  var STORAGE_KEY = "vehicleChecklistData";

  var ITEMS = [];
  var state = {};
  var carNumber = "";

  function isValidItems(x) {
    return Array.isArray(x) && x.every(function (c) {
      return c && typeof c.category === "string" && Array.isArray(c.brands) &&
        c.brands.every(function (b) { return b && typeof b.brand === "string" && Array.isArray(b.items); });
    });
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed.itemsVersion === ITEMS_VERSION && isValidItems(parsed.items)) {
          // 코드의 항목 목록과 버전이 같으면 저장된 목록 사용
          ITEMS = parsed.items;
        } else {
          // 버전이 다르면(코드의 기본 항목이 바뀌었으면) 최신 기본 목록으로 갱신
          ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
        }
        state = parsed.checks || {};
        carNumber = typeof parsed.carNumber === "string" ? parsed.carNumber : "";
      } else {
        ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
        state = {};
        carNumber = "";
      }
    } catch (e) {
      ITEMS = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      state = {};
      carNumber = "";
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: ITEMS, checks: state, carNumber: carNumber, itemsVersion: ITEMS_VERSION }));
    } catch (e) {}
  }

  function allNames() {
    var names = [];
    ITEMS.forEach(function (cat) {
      cat.brands.forEach(function (b) { b.items.forEach(function (n) { names.push(n); }); });
    });
    return names;
  }

  function categoryItemCount(cat) {
    var n = 0;
    cat.brands.forEach(function (b) { n += b.items.length; });
    return n;
  }

  function render() {
    var body = document.getElementById("checklistBody");
    body.innerHTML = "";

    if (allNames().length === 0) {
      var tr0 = document.createElement("tr");
      var td0 = document.createElement("td");
      td0.colSpan = 4;
      td0.className = "empty-row";
      td0.textContent = "표시할 점검 항목이 없습니다.";
      tr0.appendChild(td0);
      body.appendChild(tr0);
      renderSummary();
      return;
    }

    ITEMS.forEach(function (cat) {
      var catTotal = categoryItemCount(cat);
      if (catTotal === 0) return;
      var catCellPlaced = false;

      cat.brands.forEach(function (b) {
        if (b.items.length === 0) return;

        b.items.forEach(function (name, i) {
          var tr = document.createElement("tr");

          if (!catCellPlaced) {
            var catTd = document.createElement("td");
            catTd.className = "category-cell";
            catTd.rowSpan = catTotal;
            catTd.textContent = cat.category;
            tr.appendChild(catTd);
            catCellPlaced = true;
          }

          var nameTd = document.createElement("td");
          var nameDiv = document.createElement("div");
          nameDiv.className = "item-name";

          var nameStatic = document.createElement("span");
          nameStatic.className = "name-static";
          nameStatic.textContent = name;
          nameDiv.appendChild(nameStatic);

          nameTd.appendChild(nameDiv);
          tr.appendChild(nameTd);

          tr.appendChild(makeCell(name, "normal"));
          tr.appendChild(makeCell(name, "abnormal"));

          body.appendChild(tr);
        });
      });
    });
    renderSummary();
  }

  function makeCell(name, kind) {
    var td = document.createElement("td");
    td.className = "tapcell " + kind;
    if (state[name] === kind) td.className += " selected";
    var mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = "O";
    td.appendChild(mark);
    td.onclick = function () { onTap(name, kind); };
    return td;
  }

  function onTap(name, kind) {
    if (state[name] === kind) {
      delete state[name];
    } else {
      state[name] = kind;
    }
    saveData();
    render();
  }

  function renderSummary() {
    var total = allNames().length;
    var checked = Object.keys(state).length;
    var abnormal = 0;
    for (var k in state) if (state[k] === "abnormal") abnormal++;
    document.getElementById("summary").innerHTML =
      "점검 완료: <b>" + checked + "</b> / " + total +
      "&nbsp;&nbsp;·&nbsp;&nbsp;비정상: <b>" + abnormal + "</b>건";
  }

  document.getElementById("resetBtn").onclick = function () {
    state = {};
    carNumber = "";
    document.getElementById("carNumberInput").value = "";
    saveData();
    render();
  };
  document.getElementById("carNumberInput").oninput = function () {
    carNumber = this.value;
    saveData();
  };

  loadData();
  document.getElementById("carNumberInput").value = carNumber;
  render();
</script>
</body>
</html>
