<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>차량 점검 체크리스트</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .noscript-warning {
    max-width: 560px;
    margin: 10px auto;
    padding: 14px;
    background: #fef2f2;
    border: 1px solid #fca5a5;
    border-radius: 12px;
    color: #991b1b;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  html, body {
    margin: 0; padding: 0;
    background: #f3f5f8;
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif;
    color: #1f2430;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 10px 14px 14px 14px; }

  h1 {
    font-size: 16px;
    text-align: center;
    margin: 3px 0 10px 0;
    color: #111827;
  }

  .top-row { display: flex; gap: 8px; margin-bottom: 10px; }

  .filter-btn {
    flex: 1;
    padding: 9px 10px;
    border-radius: 10px;
    border: 2px solid #111827;
    background: #fff;
    color: #111827;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .filter-btn.inactive {
    border-color: #d1d5db;
    color: #9ca3af;
    background: #f9fafb;
  }
  .filter-btn:active { background: #f3f4f6; }

  #copyImageBtn {
    flex: 1;
    padding: 9px 10px;
    border-radius: 10px;
    border: 2px solid #111827;
    background: #fff;
    color: #111827;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  #copyImageBtn:active { background: #f3f4f6; }
  #copyImageBtn[disabled] { opacity: 0.6; cursor: default; }

  .table-card {
    position: relative;
    background: #fff;
    box-shadow: 0 2px 10px rgba(20,20,40,0.08);
    border: 1px solid #cbd2dd;
    overflow: hidden;
    border-radius: 4px;
    line-height: 0;
  }
  .table-card img { width: 100%; display: block; }

  .tap-overlay {
    position: absolute;
    inset: 0;
  }
  .tap-cell {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  .tap-cell .mark {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    box-sizing: border-box;
  }
  .tap-cell.normal.selected { background: rgba(22,163,74,0.10); }
  .tap-cell.normal.selected .mark { border-color: #16a34a; }
  .tap-cell.abnormal.selected { background: rgba(220,38,38,0.10); }
  .tap-cell.abnormal.selected .mark { border-color: #dc2626; }
  .tap-cell:active { background: rgba(15,23,42,0.08); }

  .empty-card {
    background: #fff;
    box-shadow: 0 2px 10px rgba(20,20,40,0.08);
    border: 1px solid #cbd2dd;
    border-radius: 4px;
    padding: 60px 20px;
    text-align: center;
    color: #9ca3af;
    font-size: 13.5px;
    line-height: 1.6;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row button {
    flex: 1;
    padding: 9px 0;
    font-size: 13px;
    font-weight: bold;
    border-radius: 9px;
    border: none;
    cursor: pointer;
  }
  #resetBtn { background: #e5e7eb; color: #374151; }
  #resetBtn:active { background: #d1d5db; }

  .car-number-group {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    border-radius: 9px;
    background: #eef2ff;
    border: 1px solid #c7d2fe;
  }
  .car-number-group label {
    flex: none;
    font-size: 12.5px;
    font-weight: bold;
    color: #3730a3;
    white-space: nowrap;
  }
  .car-number-group input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-size: 13.5px;
    font-weight: bold;
    line-height: 1.6;
    color: #111827;
    padding: 11px 0 13px 0;
    outline: none;
    text-align: center;
  }

  #captureArea { background: #f3f5f8; padding-top: 2px; }

  .summary {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    color: #6b7280;
  }
  .summary b { color: #111827; }
</style>
</head>

  // 표 이미지(1303x1024) 위에 정상/비정상 열의 위치를 %로 지정해 탭 가능한 칸을 겹쳐 놓습니다.
  var COL = {
    normal:   { left: 77.28, width: 10.90 },
    abnormal: { left: 88.18, width: 10.82 }
  };

  var OUTDOOR_ITEMS = [
    { id: "headlight",  top: 9.47,  height: 10.16 },
    { id: "grille",     top: 19.63, height: 10.25 },
    { id: "wheel_w",    top: 29.88, height: 11.13 },
    { id: "windshield", top: 41.11, height: 9.67 },
    { id: "bumper",     top: 50.78, height: 9.47 },
    { id: "door",       top: 60.35, height: 9.47 },
    { id: "fender",     top: 69.92, height: 9.08 },
    { id: "wheel_a",    top: 79.00, height: 9.67 },
    { id: "tire",       top: 88.77, height: 9.86 }
  ];

  var INDOOR_ITEMS = []; // 실내 항목은 추후 추가

  var STORAGE_KEY = "vehicleChecklistData";
  var state = {};
  var carNumber = "";
  var activeTab = "outdoor";

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state = (parsed && typeof parsed.checks === "object" && parsed.checks) ? parsed.checks : {};
        carNumber = (parsed && typeof parsed.carNumber === "string") ? parsed.carNumber : "";
      }
    } catch (e) {
      state = {};
      carNumber = "";
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ checks: state, carNumber: carNumber }));
    } catch (e) {}
  }

  function currentItems() {
    return activeTab === "outdoor" ? OUTDOOR_ITEMS : INDOOR_ITEMS;
  }

  function render() {
    document.getElementById("tabOutdoor").className = "filter-btn" + (activeTab === "outdoor" ? "" : " inactive");
    document.getElementById("tabIndoor").className = "filter-btn" + (activeTab === "indoor" ? "" : " inactive");

    document.getElementById("outdoorCard").style.display = activeTab === "outdoor" ? "" : "none";
    document.getElementById("indoorCard").style.display = activeTab === "indoor" ? "" : "none";

    var overlay = document.getElementById("tapOverlay");
    overlay.innerHTML = "";
    if (activeTab === "outdoor") {
      OUTDOOR_ITEMS.forEach(function (it) {
        overlay.appendChild(makeCell(it, "normal"));
        overlay.appendChild(makeCell(it, "abnormal"));
      });
    }

    renderSummary();
  }

  function makeCell(it, kind) {
    var col = COL[kind];
    var div = document.createElement("div");
    div.className = "tap-cell " + kind + (state[it.id] === kind ? " selected" : "");
    div.style.left = col.left + "%";
    div.style.width = col.width + "%";
    div.style.top = it.top + "%";
    div.style.height = it.height + "%";
    var mark = document.createElement("span");
    mark.className = "mark";
    div.appendChild(mark);
    div.onclick = function () { onTap(it.id, kind); };
    return div;
  }

  function onTap(id, kind) {
    if (state[id] === kind) {
      delete state[id];
    } else {
      state[id] = kind;
    }
    saveData();
    render();
  }

  function renderSummary() {
    var items = currentItems();
    var total = items.length;
    var checked = 0, abnormal = 0;
    items.forEach(function (it) {
      if (state[it.id]) checked++;
      if (state[it.id] === "abnormal") abnormal++;
    });
    if (total === 0) {
      document.getElementById("summary").innerHTML = "";
      return;
    }
    document.getElementById("summary").innerHTML =
      "점검 완료: <b>" + checked + "</b> / " + total +
      "&nbsp;&nbsp;·&nbsp;&nbsp;비정상: <b>" + abnormal + "</b>건";
  }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function isAndroid() {
    return /Android/.test(navigator.userAgent);
  }

  function openImageForCopyFallback(dataUrl, filename) {
    var win = window.open("", "_blank");
    if (!win) {
      var a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return;
    }
    win.document.write(
      "<!DOCTYPE html><html><head><meta charset='utf-8'><title>" + filename + "</title>" +
      "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" +
      "<style>body{margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;}" +
      "p{color:#fff;font-size:14px;line-height:1.5;text-align:center;padding:14px 16px;margin:0;background:#1f2430;}" +
      "img{width:100%;display:block;}</style></head><body>" +
      "<p>👇 이미지를 <b>길게 눌러</b> <b>'이미지 저장'</b>을 선택하면 갤러리에 저장됩니다.</p>" +
      "<img src='" + dataUrl + "' alt='" + filename + "'>" +
      "</body></html>"
    );
    win.document.close();
  }

  function downloadBlobDirect(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function copyImageToClipboardFallback(blob, canvas, filename, finish) {
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
        .then(function () {
          alert("이미지가 클립보드에 복사되었습니다. 원하는 곳에 붙여넣기(Ctrl+V) 하세요.");
          finish();
        })
        .catch(function () {
          openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
          finish();
        });
    } else {
      openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
      finish();
    }
  }

  function shareOrCopyImage() {
    var btn = document.getElementById("copyImageBtn");
    if (typeof html2canvas === "undefined") {
      alert("이미지 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.");
      return;
    }
    var target = document.getElementById("wrap");
    var originalLabel = btn.textContent;
    var filename = "차량점검.png";

    function finish() {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }

    html2canvas(target, {
      backgroundColor: "#f3f5f8",
      scale: Math.max(2, window.devicePixelRatio || 1),
      useCORS: true,
      scrollX: 0,
      scrollY: -window.scrollY
    }).then(function (canvas) {
      btn.disabled = true;
      btn.textContent = "처리 중...";
      canvas.toBlob(function (blob) {
        if (!blob) {
          alert("이미지 생성에 실패했습니다.");
          finish();
          return;
        }

        if (isAndroid()) {
          downloadBlobDirect(blob, filename);
          finish();
          return;
        }

        var file = new File([blob], filename, { type: "image/png" });

        if (isIOS()) {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "차량 점검 체크리스트" })
              .then(finish)
              .catch(function () {
                openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
                finish();
              });
          } else {
            openImageForCopyFallback(canvas.toDataURL("image/png"), filename);
            finish();
          }
          return;
        }

        copyImageToClipboardFallback(blob, canvas, filename, finish);
      }, "image/png");
    }).catch(function (err) {
      alert("이미지 생성에 실패했습니다: " + err);
      finish();
    });
  }

  document.getElementById("copyImageBtn").onclick = shareOrCopyImage;

  document.getElementById("tabOutdoor").onclick = function () { activeTab = "outdoor"; render(); };
  document.getElementById("tabIndoor").onclick = function () { activeTab = "indoor"; render(); };

  document.getElementById("resetBtn").onclick = function () {
    state = {};
    carNumber = "";
    document.getElementById("carNumberInput").value = "";
    saveData();
    render();
  };
  document.getElementById("carNumberInput").oninput = function () {
    carNumber = this.value;
    saveData();
  };

  loadData();
  document.getElementById("carNumberInput").value = carNumber;
  render();
</script>
</body>
</html>
